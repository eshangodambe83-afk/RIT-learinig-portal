<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest AI News</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: var(--text-main);
            font-size: 2rem;
        }

        .refresh-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .refresh-btn:hover {
            background-color: #1d4ed8;
        }

        .refresh-btn:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        .news-grid {
            display: grid;
            gap: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .news-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .news-title {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .news-title a {
            color: var(--text-main);
            text-decoration: none;
        }

        .news-title a:hover {
            color: var(--primary-color);
        }

        .news-meta {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .loading, .error {
            text-align: center;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .error {
            color: #dc2626;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(37, 99, 235, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Latest AI News</h1>
            <button id="refreshBtn" class="refresh-btn" onclick="fetchNews()">Refresh</button>
        </header>
        <main id="newsContainer">
            <!-- News items will be injected here -->
        </main>
    </div>

    <script>
        const newsContainer = document.getElementById('newsContainer');
        const refreshBtn = document.getElementById('refreshBtn');

        function showLoading() {
            refreshBtn.disabled = true;
            newsContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Fetching latest AI news...</div>
                </div>
            `;
        }

        function showError(message) {
            refreshBtn.disabled = false;
            newsContainer.innerHTML = `
                <div class="error">
                    <strong>Error loading news</strong><br>
                    ${message}
                </div>
            `;
        }

        function renderNews(items) {
            refreshBtn.disabled = false;

            if (!items || items.length === 0) {
                newsContainer.innerHTML = `
                    <div class="loading">
                        No news found at the moment.
                    </div>
                `;
                return;
            }

            const html = `<div class="news-grid">
                ${items.map(item => `
                    <article class="news-card">
                        <h2 class="news-title">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer">
                                ${item.title}
                            </a>
                        </h2>
                        <div class="news-meta">
                            ${new Date(item.pubDate).toLocaleString(undefined, {
                                dateStyle: 'medium',
                                timeStyle: 'short'
                            })}
                        </div>
                    </article>
                `).join('')}
            </div>`;

            newsContainer.innerHTML = html;
        }

        async function fetchNews() {
            showLoading();
            try {
                // First try the local API
                let data = null;
                let usedFallback = false;
                try {
                    const response = await fetch('/api/news');
                    if (response.ok) {
                        data = await response.json();
                    } else {
                        usedFallback = true;
                    }
                } catch (e) {
                    console.log("Local API failed, falling back to rss2json");
                    usedFallback = true;
                }

                // Fallback to proxy to bypass CORS and get direct JSON
                if (usedFallback) {
                    const rssUrl = encodeURIComponent('https://news.google.com/rss/search?q=Artificial+Intelligence+when:1d&hl=en-US&gl=US&ceid=US:en');
                    const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}&api_key=`;

                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("Proxy fetch failed");

                    const proxyData = await response.json();

                    if (proxyData.status === 'ok') {
                        data = {
                            ok: true,
                            items: proxyData.items.slice(0, 10).map(item => ({
                                title: item.title,
                                link: item.link,
                                pubDate: item.pubDate
                            }))
                        };
                    } else {
                        throw new Error("RSS2JSON proxy returned error");
                    }
                }

                if (data && data.ok) {
                    renderNews(data.items);
                } else {
                    showError(data.error || 'Unknown error');
                }
            } catch (error) {
                console.error(error);
                showError(error.message);
            }
        }

        // Initial load
        fetchNews();
    </script>
</body>
</html>
